title: apple-light
author: xSaleGG
attribution: 'Inspired by Apple system colors'
theme:
  # Colors and surfaces
  background-image: none
  colors-background: '#F5F5F7'
  colors-text: '#1D1D1F'
  colors-title: '#1D1D1F'
  colors-sidebar-background: 'rgba(255, 255, 255, 0.92)'
  colors-sidebar-border: '1px solid rgba(60, 60, 67, 0.18)'
  sidebar-divider: '1px solid rgba(60, 60, 67, 0.18)'

  # Typography and sidebar sizing
  font-family: "'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Inter Variable', system-ui, sans-serif"
  sizes-sidebar-time: 3.4rem
  sidebar-font-size: 1rem
  drawer-font-size: 0.925rem

  # Button states
  button-background-color-on: '#0066CC'
  button-background-color-off: '#E5E5EA'
  button-name-color-on: '#FFFFFF'
  button-name-color-off: '#1D1D1F'
  button-state-color-on: 'rgba(255, 255, 255, 0.92)'
  button-state-color-off: '#636366'

  # Display-only tiles
  display-only-background-color: '#E5E5EA'
  display-only-name-color: '#1D1D1F'
  display-only-state-color: '#636366'

  # Navigation and modal surfaces
  drawer-button-background-color: '#E5E5EA'
  navigate-background-color: 'rgba(60, 60, 67, 0.10)'
  modal-background-color-modal: 'rgba(255, 255, 255, 0.96)'

  # Dashboard spacing and corner radii
  sidebar-padding: 0 1.4rem
  sidebar-item-padding: 0.6rem 0.6rem
  card-padding: 0.72rem
  border-radius: 0.65rem
  border-radius-small: 0.4rem
  border-radius-modal: 1.2rem

  # Browser and app chrome
  app-color: '#F5F5F7'
